<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Experience Survey</title>
  <meta name="description" content="Share your feedback in a short survey.">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <!--
    Content Security Policy: only this site's own files may run, and the form
    may only talk to Google Apps Script. If you change hosting or add
    analytics, update this list.
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com http://localhost:* http://127.0.0.1:*; form-action 'none'; base-uri 'self'; object-src 'none'">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e6b5c'/%3E%3Cpath d='M10 16.5l4 4 8-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#survey-main">Skip to the survey</a>

  <header class="site-header">
    <div class="site-header__inner">
      <span class="brand">
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="brand__name" data-bind="brandName">Your Brand</span>
      </span>
      <span class="site-header__meta" data-bind="estimatedTime"></span>
    </div>
  </header>

  <main id="survey-main" class="page" tabindex="-1">
    <div class="intro">
      <p class="eyebrow">Survey</p>
      <h1 class="intro__title" data-bind="title">Customer Experience Survey</h1>
      <p class="intro__desc" data-bind="description"></p>
    </div>

    <div class="card" id="survey-card">
      <!-- Progress (filled by app.js) -->
      <div class="progress" id="progress" hidden>
        <div class="progress__text" id="progress-text" aria-live="polite"></div>
        <div class="progress__track" aria-hidden="true"><div class="progress__bar" id="progress-bar"></div></div>
      </div>

      <!-- Error summary appears here after a failed submit attempt -->
      <div class="alert alert--error" id="error-summary" role="alert" tabindex="-1" hidden></div>

      <form id="survey-form" class="form" novalidate aria-describedby="required-note">
        <p class="required-note" id="required-note">Fields marked <span class="req" aria-hidden="true">*</span><span class="visually-hidden">with an asterisk</span> are required.</p>

        <div id="form-sections"><!-- Questions are rendered from js/form-config.js --></div>

        <!-- Honeypot: hidden from people, often filled in by bots. Leave empty. -->
        <div class="hp" aria-hidden="true">
          <label for="hp_field">Leave this field empty</label>
          <input type="text" id="hp_field" name="hp_field" tabindex="-1" autocomplete="off">
        </div>

        <div class="alert alert--error" id="submit-error" role="alert" hidden>
          <div class="alert__body">
            <strong class="alert__title" id="submit-error-title">We couldn’t submit your response</strong>
            <p id="submit-error-message"></p>
          </div>
          <button type="button" class="btn btn--secondary btn--sm" id="retry-btn">Try again</button>
        </div>

        <div class="form__actions">
          <button type="submit" class="btn btn--primary" id="submit-btn">
            <span class="spinner" aria-hidden="true"></span>
            <span class="btn__label" id="submit-label">Submit response</span>
          </button>
          <p class="sr-status visually-hidden" id="submit-status" role="status" aria-live="polite"></p>
        </div>
      </form>

      <section class="success" id="success-panel" hidden aria-labelledby="success-title">
        <div class="success__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="28" height="28"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <h2 class="success__title" id="success-title" tabindex="-1">Thank you</h2>
        <p class="success__msg" id="success-message"></p>
        <p class="success__ref">Reference: <code id="success-ref"></code></p>
        <button type="button" class="btn btn--secondary" id="again-btn">Submit another response</button>
      </section>

      <noscript>
        <div class="alert alert--error">This survey needs JavaScript. Please enable it in your browser settings and reload the page.</div>
      </noscript>
    </div>

    <aside class="privacy" aria-labelledby="privacy-title">
      <svg class="privacy__icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3l7 3v5c0 4.4-3 8.4-7 9.9C8 19.4 5 15.4 5 11V6l7-3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <div>
        <h2 class="privacy__title" id="privacy-title">How your response is handled</h2>
        <p class="privacy__text" data-bind="privacyNotice"></p>
      </div>
    </aside>
  </main>

  <footer class="site-footer">
    <p>© <span id="year"></span> <span data-bind="brandName">Your Brand</span></p>
  </footer>

  <script src="js/form-config.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
